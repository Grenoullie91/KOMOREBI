; Export-Voreinstellungen fuer KOMOREBI.
;
; Drei Presets mit klar getrennten Zielen:
;   Android Debug    - Debug-APK fuer den Emulator (arm64 + x86_64)
;   Android Release  - Release-APK fuer Geraetepruefung (arm64 + armv7 + x86_64)
;   Android AAB      - App Bundle fuer Google Play (arm64 + armv7, kein x86)
;
; Alle Presets teilen sich Application ID, Version und Label. Nur Pfad,
; Build-Typ und ABI-Menge unterscheiden sich - so kann der Emulator-Test das
; Release-Artefakt testen, ohne dass eine zweite Identitaet entsteht.

[preset.0]

name="Android Debug"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="LICENSE, LICENSING.md, GODOT_COPYRIGHT.txt, assets/fonts/OFL.txt"
exclude_filter="build/*, artifacts/*, tools/*, signing/*, store/*, scripts/core/autoplay.gd, README.md, AGENTS.md, export_presets.cfg"
export_path="build/android/komorebi-debug.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=1
version/name="1.0.0"
package/unique_name="de.komorebi.game"
package/name="KOMOREBI"
package/signed=true
package/app_category=0
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192="res://assets/icons/launcher_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/icons/adaptive_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://assets/icons/adaptive_background_432.png"
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()

