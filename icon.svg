<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- KOMOREBI - App-Symbol: ein Schatten wird vom Licht zersprengt.
       Farbwelt identisch zum Spiel: Nachtblau, Bernstein, Mint. -->
  <defs>
    <linearGradient id="nacht" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1c"/>
      <stop offset="1" stop-color="#1d1522"/>
    </linearGradient>
    <radialGradient id="glueh" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#ffc46b" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ff8f3c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8f3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#nacht)"/>

  <!-- Lichtschein hinter der Figur -->
  <circle cx="256" cy="250" r="210" fill="url(#glueh)"/>

  <!-- Zersprengter Schatten: zwei gegenlaeufige Ringe -->
  <g transform="translate(256 250)">
    <g transform="rotate(-8)">
      <path d="M0 -118 L104 -36 L64 98 L-64 98 L-104 -36 Z"
            fill="#0e0a1c" stroke="#a98bff" stroke-width="13" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(22)">
      <path d="M0 -118 L104 -36 L64 98 L-64 98 L-104 -36 Z"
            fill="#0e0a1c" stroke="#5fe9c0" stroke-width="13" stroke-linejoin="round" opacity="0.85"/>
    </g>
    <circle cx="0" cy="0" r="34" fill="#ffe9a8"/>
  </g>

  <!-- Funken: das Licht gewinnt -->
  <g fill="#ffc46b">
    <circle cx="150" cy="128" r="11"/>
    <circle cx="372" cy="146" r="8"/>
    <circle cx="392" cy="318" r="10"/>
    <circle cx="138" cy="336" r="7"/>
    <circle cx="256" cy="418" r="9"/>
    <circle cx="86"  cy="232" r="6"/>
    <circle cx="430" cy="228" r="6"/>
  </g>
</svg>