AutoName: KOMOREBI
Summary: Tap-tap arcade game about destroying shadows before light fades
Description: |-
  KOMOREBI is a small tap-tap arcade game made with Godot Engine.

  Shadows drift out of the dark and you tap them away before the light
  fades. Keep the combo alive, catch the stars and clear eight chapters,
  then push your score as far as it goes in endless mode.

  Features:

  • Fast arcade gameplay with simple touch controls
  • Campaign mode with eight chapters
  • Endless mode with a persistent high score
  • Combo multipliers and critical hits
  • Four shadow types, each with its own behaviour
  • Fully offline: no ads, no tracking, no account, no in-app purchases

  The project ships the license texts for KOMOREBI, the Inter typeface
  and Godot Engine as part of the game.

RepoType: git
Repo: https://github.com/Grenoullie91/KOMOREBI.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: ea383b15c08c6a48f0adaaf6ed6520cab3476bd1
    sudo:
      - apt-get update
      - apt-get install -y pkgconf scons g++ strip-nondeterminism
    output: build/android/komorebi-fdroid.apk
    srclibs:
      - Godot@ed1daf0bf001b61586d9930840f2f1394092c079
      - reproducible-apk-tools@v0.3.0
    build:
      - ./fdroid/build.sh $$Godot$$ $$NDK$$ $$SDK$$
    ndk: 29.0.14206865
    postbuild:
      - strip-nondeterminism -t zip $$OUT$$
      - mv $$OUT$$ unaligned.apk
      - $$reproducible-apk-tools$$/zipalign.py --page-size 16 
        --pad-like-apksigner --replace unaligned.apk $$OUT$$

AutoUpdateMode: None
